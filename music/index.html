<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кассета — gadaev.pro/music</title>
<meta name="theme-color" content="#12002b">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Кассета">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff2d95;--cy:#00e5ff;--yel:#ffe600;--vio:#7b2cff;--lcd:#a8ff60;--d1:#3a3a46;--d2:#1b1b24;--lcdbg:#12200a;--glow:#ff2d9588;--bg:repeating-linear-gradient(115deg,transparent 0 38px,#ffffff08 38px 40px),radial-gradient(circle at 15% 0,#7b2cff88,transparent 55%),radial-gradient(circle at 95% 35%,#ff2d9566,transparent 45%),linear-gradient(170deg,#12002b,#001c40)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:'VT323',monospace;font-size:20px;color:#fff;min-height:100vh;padding:14px 12px 40px;max-width:560px;margin:auto;
background:var(--bg);background-attachment:fixed}
h1{font:16px 'Press Start 2P',monospace;text-align:center;margin:6px 0 14px;line-height:1.5;color:var(--yel);text-shadow:3px 3px 0 var(--pink),6px 6px 0 var(--vio)}
h1 small{display:block;font-size:9px;color:var(--cy);text-shadow:none;margin-top:4px}
.deck{background:linear-gradient(var(--d1),var(--d2));border:3px solid #000;border-radius:16px;padding:12px;box-shadow:0 0 0 3px var(--pink),0 0 30px var(--glow),inset 0 2px 0 #ffffff40}
.tape{position:relative;height:158px;border-radius:10px;border:3px solid #000;background:linear-gradient(135deg,var(--pink) 0 45%,var(--yel) 45% 55%,var(--cy) 55%)}
.label{display:flex;gap:8px;align-items:center;background:#fff8d6;color:#111;margin:9px;padding:6px;height:76px;border-radius:5px;border-bottom:4px solid #111;overflow:hidden}
.label img{width:60px;height:60px;object-fit:cover;border:2px solid #111;background:#ddd;flex:none}
.label b{display:block;font:11px 'Press Start 2P',monospace;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.label span{display:block;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.label div{min-width:0}
.win{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:64%;height:46px;background:#0c0c10;border:3px solid #000;border-radius:23px;display:flex;justify-content:space-around;align-items:center}
.reel{width:34px;height:34px;border-radius:50%;border:3px solid #ddd;background:repeating-conic-gradient(#fff 0 20deg,#222 20deg 60deg)}
.play .reel{animation:sp 1.1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.lcd{margin:12px 0 8px;background:var(--lcdbg);border:3px inset #444;border-radius:6px;padding:6px 10px;color:var(--lcd);text-shadow:0 0 6px var(--lcd);display:flex;justify-content:space-between;gap:10px}
.lcd #ti{white-space:nowrap;overflow:hidden;flex:1}
.lcd #ti i{display:inline-block;font-style:normal;padding-left:100%;animation:mq 12s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
canvas{display:block;width:100%;height:64px;background:#08080e;border:3px inset #444;border-radius:6px}
input[type=range]{accent-color:var(--pink)}
#seek{width:100%;margin:8px 0 4px;height:30px}
.btns{display:flex;gap:7px;margin-top:6px}
.b{flex:1;font:15px 'Press Start 2P',monospace;padding:12px 0 9px;color:#111;background:linear-gradient(#e8e8f0,#9a9aa8);border:2px solid #000;border-bottom-width:6px;border-radius:8px;cursor:pointer;min-height:48px}
.b:active,.b.on{transform:translateY(3px);border-bottom-width:3px}
.b.go{background:linear-gradient(var(--yel),#ffb300)}
.b.pk{background:linear-gradient(#ff7cc0,var(--pink))}
.b.cy{background:linear-gradient(#9ff6ff,var(--cy))}
.row{display:flex;align-items:center;gap:10px;margin-top:10px}
.row input{flex:1}
.eq{display:flex;justify-content:space-around;align-items:flex-end;margin-top:12px;padding:10px 4px 6px;background:#101018;border:2px solid #000;border-radius:8px}
.eq div{text-align:center;font-size:16px;color:var(--cy)}
.eq input{writing-mode:vertical-lr;direction:rtl;height:100px;width:28px}
.pre{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pre .b{font-size:9px;padding:9px 0 6px;min-height:36px;border-bottom-width:4px}
form{display:flex;gap:8px;margin:18px 0 8px}
form input{flex:1;min-width:0;font:22px 'VT323',monospace;padding:8px 10px;border:3px solid #000;border-radius:8px;background:#fff8d6;color:#111;box-shadow:4px 4px 0 var(--cy)}
form .b{flex:none;padding:0 14px}
.tabs{display:flex;gap:8px;margin:6px 0}
.tabs .b{font-size:10px}
.t{display:flex;align-items:center;gap:10px;padding:8px;margin:7px 0;background:#ffffff14;border:2px solid #ffffff30;border-radius:10px}
.t.now{border-color:var(--yel);background:#ffe60022}
.t img{width:52px;height:52px;border-radius:6px;object-fit:cover;background:#333;flex:none;cursor:pointer}
.t .i{flex:1;min-width:0;cursor:pointer}
.t .i b{display:block;font-weight:400;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t .i span{color:var(--cy);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.t button{font-size:20px;background:#000;color:#fff;border:2px solid var(--pink);border-radius:8px;width:42px;height:42px;cursor:pointer}
.t button.ok{border-color:var(--lcd)}
.t{position:relative;overflow:hidden}
.t .more{border:none;background:transparent;width:34px;font-size:28px;line-height:1;position:relative;z-index:2}
.t.open .more{color:var(--yel)}
.act{position:absolute;right:46px;top:0;bottom:0;display:flex;align-items:center;gap:7px;padding:0 9px;background:#2a0a4a;border-left:3px solid var(--pink);transform:translateX(calc(100% + 46px));visibility:hidden;transition:transform .2s,visibility .2s}
.t.open .act{transform:none;visibility:visible}
.eq input:disabled{opacity:.35}
.lk{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chs{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.ch{font:20px 'VT323',monospace;color:#fff;background:#ffffff1c;border:2px solid var(--pink);border-radius:20px;padding:6px 12px;cursor:pointer}
.m.h{text-align:left;padding:6px 0 2px;color:var(--yel)}
.lk a{flex:1;min-width:44%;text-align:center;text-decoration:none;color:#111;font-size:20px;padding:10px 6px;background:linear-gradient(#9ff6ff,var(--cy));border:2px solid #000;border-bottom-width:5px;border-radius:8px}
.t .i small{display:block;font-size:15px;color:var(--yel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t{transition:transform .15s;-webkit-user-select:none;user-select:none}
.t img{-webkit-touch-callout:none;-webkit-user-drag:none}
.t.drag{transition:none;z-index:5;box-shadow:0 0 0 3px var(--yel),0 8px 24px #000a;background:#4a1a7a}
.m{text-align:center;color:#ffffffaa;padding:14px}
#toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,80px);background:var(--yel);color:#111;padding:10px 16px;border:3px solid #000;border-radius:8px;transition:.25s;z-index:9}
#toast.s{transform:translate(-50%,0)}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.np{display:flex;align-items:center;gap:8px;margin:0 0 8px;color:var(--lcd);font-size:21px}
.np[hidden]{display:none}
.np span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .ch{padding:3px 10px;font-size:18px;white-space:nowrap}
form input{width:100%}
.sb{position:relative;flex:1;min-width:0}
#qx{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:none;border-radius:50%;background:#0003;color:#111;font-size:18px;cursor:pointer;box-shadow:none}
#sg{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff8d6;color:#111;border:3px solid #000;border-radius:8px;z-index:20;max-height:320px;overflow:auto;box-shadow:4px 4px 0 var(--cy)}
#sg[hidden]{display:none}
.sgi{padding:9px 12px;font-size:23px;border-bottom:1px solid #0002;cursor:pointer}
.plh{display:flex;align-items:center;gap:8px;margin:6px 0}
.plh .b{flex:none;width:52px;padding:0}
.plt{flex:1;text-align:center;min-width:0}
.plt b{display:block;font-weight:400;font-size:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plt small{color:var(--cy);font-size:16px}
.cty{display:flex;width:100%;justify-content:space-between;align-items:center;font:22px 'VT323',monospace;color:#fff;background:#ffffff14;border:2px solid #ffffff30;border-radius:10px;padding:10px 12px;margin:5px 0;cursor:pointer;text-align:left}
.cty.on{border-color:var(--yel)}
.cty i{font-style:normal;color:var(--cy);font-size:18px}
#md{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:30}
#md[hidden]{display:none}
.mdb{width:100%;max-width:560px;background:var(--d2);border:3px solid var(--pink);border-radius:16px 16px 0 0;padding:14px 14px 22px}
html[data-theme=winamp]{--pink:#c8c8d0;--cy:#00d800;--yel:#ffcf00;--vio:#555;--lcd:#00ff00;--bg:linear-gradient(#2b2b36,#14141a);--d1:#4a4a58;--d2:#22222c;--lcdbg:#000;--glow:#0000}
html[data-theme=cassette]{--pink:#e4572e;--cy:#76b041;--yel:#f2c14e;--vio:#6b4423;--lcd:#ffb347;--bg:linear-gradient(170deg,#3b2a1e,#1d140d);--d1:#6b5440;--d2:#3a2c20;--lcdbg:#1c1005;--glow:#e4572e66}
html[data-theme=cyber]{--pink:#ff00e5;--cy:#00fff0;--yel:#f5ff00;--vio:#7a00ff;--lcd:#00fff0;--bg:radial-gradient(circle at 20% 0,#7a00ff55,transparent 55%),radial-gradient(circle at 90% 40%,#ff00e544,transparent 50%),#05010f;--d1:#1a0f2e;--d2:#0a0516;--lcdbg:#02060d;--glow:#ff00e5aa}
html[data-theme=sunset]{--pink:#ff5e62;--cy:#ffd166;--yel:#fff3b0;--vio:#6a1b9a;--lcd:#ffd166;--bg:linear-gradient(170deg,#2b0a3d,#7a1e48 55%,#ff7b54);--d1:#5a2a4a;--d2:#2a1230;--lcdbg:#1d0a1f;--glow:#ff5e6288}
html[data-theme=mono]{--pink:#fff;--cy:#cfcfcf;--yel:#fff;--vio:#777;--lcd:#e8e8e8;--bg:#000;--d1:#2a2a2a;--d2:#0d0d0d;--lcdbg:#0a0a0a;--glow:#ffffff22}
</style>
</head>
<body class="">

<section class="deck" id="deck">
  <div class="tape">
    <div class="label"><img id="cv" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%23ff2d95'/%3E%3Cpath d='M3 2v3.2a1.2 1.2 0 1 0 .8 1.1V3.6L6 3V2z' fill='%23fff'/%3E%3C/svg%3E"><div><b id="lt">Вставь кассету</b><span id="la">найди трек ниже</span></div></div>
    <div class="win"><i class="reel"></i><i class="reel"></i></div>
  </div>
  <div class="lcd"><div id="ti"><i>— нет кассеты —</i></div><div id="tm">0:00</div></div>
  <div class="np" id="np" hidden><span id="npt"></span><button class="ch" id="npq" aria-label="Найти трек">🔎 Найти</button></div>
  <canvas id="vz" width="520" height="64"></canvas>
  <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Перемотка">
  <div class="btns">
    <button class="b" id="prev" aria-label="Назад">|◀</button>
    <button class="b go" id="pp" aria-label="Играть">▶</button>
    <button class="b" id="stop" aria-label="Стоп">■</button>
    <button class="b" id="next" aria-label="Вперёд">▶|</button>
    <button class="b pk" id="save" aria-label="В плейлист">+</button>
    <button class="b cy" id="shr" aria-label="Поделиться">↗</button>
  </div>
  <div class="row"><button class="b cy" id="mode" aria-label="Режим воспроизведения">🔁</button><button class="b pk" id="thm" aria-label="Тема оформления">🎨</button><button class="b" id="fxb" aria-label="Точные индикаторы">VU</button></div>
</section>

<form id="f"><div class="sb"><input id="q" placeholder="Название или исполнитель" autocomplete="off" aria-label="Поиск"><button type="button" id="qx" aria-label="Очистить" hidden>✕</button><div id="sg" hidden></div></div><button class="b go" aria-label="Найти">OK</button></form>
<div class="tabs"><button class="b on" id="t1">Поиск</button><button class="b" id="t3">Радио</button><button class="b" id="t2">Плейлист</button><label class="b pk" for="fi" style="display:block;text-align:center;font-size:10px;line-height:2.2;cursor:pointer">+ Файл</label><input type="file" id="fi" accept="audio/*" multiple hidden></div>
<div id="list"></div>
<div id="toast"></div>
<div id="md" hidden><div class="mdb"><p class="m h" style="padding-top:0">Добавить в плейлист</p><div id="mdl"></div><button class="b" id="mdc" style="width:100%;margin-top:6px;font-size:11px">Отмена</button></div></div>

<script>
// ===== Настройки =====
const APP='GADAEV_MUSIC';
const JAMENDO_KEY='6683c7da'; // необязательно: client_id с devportal.jamendo.com — добавит второй каталог (CC-музыка)
const DEF_HOST='https://discoveryprovider.audius.co';
// =====================
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let FX=false;try{FX=localStorage.getItem('tape_fx')==='1'}catch(e){}
const au=new Audio();if(FX)au.crossOrigin='anonymous';au.preload='auto';
let ctx,an,filt=[],HOST,results=[],queue=[],qi=-1,cur=null,tab=1;
let PLS=[],cp=0,pl=[];
try{PLS=JSON.parse(localStorage.getItem('tape_pls')||'null')||[]}catch(e){}
if(!PLS.length){let old=[];try{old=JSON.parse(localStorage.getItem('tape_pl')||'[]')}catch(e){}PLS=[{n:'Мой плейлист',t:old}]}
try{cp=Math.min(+localStorage.getItem('tape_cp')||0,PLS.length-1)}catch(e){}
pl=PLS[cp].t;
const savePL=()=>{try{localStorage.setItem('tape_pls',JSON.stringify(PLS));localStorage.setItem('tape_cp',cp)}catch(e){}};
let mode=0,hist=[],HOSTS=[],errs=0,userPaused=false,dr=null,noClick=0,lastPS=0,lastSave=0,pendingPos=0,lastQ='';const blobs=new Map();
let qh=[],chartsC=[];try{qh=JSON.parse(localStorage.getItem('tape_q')||'[]')}catch(e){}
let favs=[],radioRes=[],radioTitle='',countriesC=[],openC='',cst={},RL=[],sgSeq=0;try{favs=JSON.parse(localStorage.getItem('tape_rfav')||'[]')}catch(e){}
try{mode=+localStorage.getItem('tape_mode')||0}catch(e){}
async function loadBlobs(){try{const c=await caches.open('tapes');for(const t of PLS.flatMap(p=>p.t)){if(t.off&&!blobs.has(t.id)){const m=await c.match(key(t.id));if(m)blobs.set(t.id,URL.createObjectURL(await m.blob()))}}}catch(e){}}
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('s');clearTimeout(toast.k);toast.k=setTimeout(()=>t.classList.remove('s'),2200)};
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const key=id=>location.origin+'/__tape/'+encodeURIComponent(id);

// --- Индикаторы уровня и темы ---
$('#fxb').classList.toggle('on',FX);
$('#fxb').onclick=()=>{try{localStorage.setItem('tape_fx',FX?'0':'1')}catch(e){}saveState();toast(FX?'Точные индикаторы выключены':'Точные индикаторы включены. В фоне звук может обрываться');setTimeout(()=>location.reload(),1200)};
const THEMES=[['neon','Неон 90-х'],['winamp','Винамп'],['cassette','Кассета'],['cyber','Киберпанк'],['sunset','Закат'],['mono','Монохром']];
let ti=0,VC=['#00e5ff','#ffe600','#ff2d95'];try{ti=+localStorage.getItem('tape_theme')||0}catch(e){}
function applyTheme(i,say){
  ti=i;document.documentElement.setAttribute('data-theme',THEMES[i][0]);try{localStorage.setItem('tape_theme',i)}catch(e){}
  const g=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();VC=[g('--cy'),g('--yel'),g('--pink')];
  if(say)toast('Тема: '+THEMES[i][1]);
}
$('#thm').onclick=()=>applyTheme((ti+1)%THEMES.length,1);applyTheme(ti,0);
function initAudio(){
  if(ctx||!FX)return;
  ctx=new(window.AudioContext||window.webkitAudioContext)();
  const n=ctx.createMediaElementSource(au);
  ctx.onstatechange=()=>{if(!au.paused&&ctx.state!=='running')ctx.resume().catch(()=>{})};
  an=ctx.createAnalyser();an.fftSize=128;an.smoothingTimeConstant=.75;n.connect(an);an.connect(ctx.destination);
}

// --- Визуализатор ---
const cv=$('#vz'),c2=cv.getContext('2d');
(function draw(){
  requestAnimationFrame(draw);
  c2.fillStyle='#08080e';c2.fillRect(0,0,cv.width,cv.height);
  const N=26,w=cv.width/N;let d=new Uint8Array(64);
  if(an&&!au.paused)an.getByteFrequencyData(d);else if(!an&&!au.paused){const t=Date.now()/180;for(let i=0;i<64;i++)d[i]=Math.max(0,Math.min(255,150+90*Math.sin(t+i*.9)*Math.sin(t*.37+i*.31)-i*2))}
  for(let i=0;i<N;i++){
    const h=d[i+1]/255*cv.height,segs=Math.round(h/6);
    for(let s=0;s<segs;s++){c2.fillStyle=s>9?VC[2]:s>6?VC[1]:VC[0];c2.fillRect(i*w+2,cv.height-(s+1)*6,w-4,4)}
  }
})();

// --- Источники музыки ---
async function host(){
  if(HOST)return HOST;
  try{const j=await(await fetch('https://api.audius.co')).json();HOSTS=j.data;HOST=HOSTS[Math.floor(Math.random()*HOSTS.length)]}catch(e){HOST=DEF_HOST}
  return HOST;
}
const ccName=u=>{const m=/creativecommons\.org\/(licenses|publicdomain)\/([a-z0-9-]+)/i.exec(u||'');return m?(m[2]=='zero'?'CC0':m[2]=='mark'?'Public Domain':'CC '+m[2].toUpperCase()):''};
const norm=x=>String(x||'').toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
const auT=d=>({from:'Audius',pop:(d.play_count||0)+3*(d.favorite_count||0),lic:typeof d.license==='string'?d.license:'',id:'au:'+d.id,title:d.title,artist:d.user&&d.user.name,cover:d.artwork&&(d.artwork['480x480']||d.artwork['150x150']),dur:d.duration});
const jaT=d=>({from:'Jamendo',lic:ccName(d.license_ccurl),id:'ja:'+d.id,src:d.audio,title:d.name,artist:d.artist_name,cover:d.image,dur:d.duration});
const srcOf=t=>t.id.startsWith('au:')?`${HOST||DEF_HOST}/v1/tracks/${t.id.slice(3)}/stream?app_name=${APP}`:t.src;
const iaT=async(id,pop)=>{try{
  const j=await(await fetch('https://archive.org/metadata/'+encodeURIComponent(id))).json();
  const f=(j.files||[]).find(x=>/MP3/i.test(x.format||''));if(!f)return;
  const m=j.metadata||{},one=v=>[].concat(v||[])[0];
  return{from:'Archive',pop:pop||0,lic:ccName(m.licenseurl),id:'ia:'+id,src:'https://archive.org/download/'+encodeURIComponent(id)+'/'+f.name.split('/').map(encodeURIComponent).join('/'),title:one(m.title)||id,artist:one(m.creator)||'Internet Archive',cover:'https://archive.org/services/img/'+encodeURIComponent(id),dur:parseFloat(f.length)||0};
}catch(e){}};
const strip=h=>String(h||'').replace(/<[^>]*>/g,'').trim();
const WCQ='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=url|mime|extmetadata&';
const wcT=p=>{const ii=(p&&p.imageinfo||[])[0];if(!ii||!ii.mime||!au.canPlayType(ii.mime))return;const e=ii.extmetadata||{},v=k=>e[k]&&strip(e[k].value);
  return{from:'Wikimedia Commons',id:'wc:'+p.pageid,src:ii.url,title:v('ObjectName')||p.title.replace(/^File:/,'').replace(/\.[^.]+$/,'').replace(/_/g,' '),artist:v('Artist')||'Wikimedia Commons',cover:'',dur:0,lic:v('LicenseShortName')||''}};

    return play(queue,mode==1&&hist.length?hist.pop():(qi-1+queue.length)%queue.length,true)}
  play(queue,nextIdx());
};
function setMode(m,say){mode=m;try{localStorage.setItem('tape_mode',m)}catch(e){}$('#mode').textContent=MICON[m];if(say)toast(MNAME[m])}
au.onplay=()=>{userPaused=false;$('#deck').classList.add('play');$('#pp').textContent='❚❚';if('mediaSession' in navigator)navigator.mediaSession.playbackState='playing'};
au.onpause=()=>{if(!document.hidden&&!au.ended&&au.readyState>1)userPaused=true;$('#deck').classList.remove('play');$('#pp').textContent='▶';if('mediaSession' in navigator)navigator.mediaSession.playbackState='paused'};
au.onended=()=>{if(mode==2){au.currentTime=0;au.play()}else step(1)};
au.onerror=()=>{if(!au.src)return;toast('Трек недоступен');if(++errs<3)setTimeout(()=>step(1),800)};
au.onplaying=()=>{errs=0;if(cur&&cur.radio)setTimeout(pollNP,1500)};
function saveState(){try{if(!cur)return;localStorage.setItem('tape_state',JSON.stringify({cur,pos:au.currentTime||pendingPos||0,q:(()=>{const k=PLS.findIndex(p=>p.t===queue);return k>=0?'pl:'+k:queue.slice(0,40)})()}))}catch(e){}}
function posState(force){
  if(!('mediaSession' in navigator)||!isFinite(au.duration)||!au.duration)return;
  const n=Date.now();if(!force&&n-lastPS<1000)return;lastPS=n;
  try{navigator.mediaSession.setPositionState({duration:au.duration,position:Math.min(au.currentTime,au.duration),playbackRate:1})}catch(e){}
}
['play','pause','seeked','loadedmetadata','durationchange'].forEach(ev=>au.addEventListener(ev,()=>posState(1)));
au.addEventListener('pause',saveState);addEventListener('pagehide',saveState);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveState()});
au.ontimeupdate=()=>{$('#tm').textContent=fmt(au.currentTime)+' / '+fmt(au.duration);if(au.duration){$('#seek').value=au.currentTime/au.duration*1000;posState()}if(Date.now()-lastSave>3000){lastSave=Date.now();saveState()}};
$('#seek').oninput=e=>{if(au.duration)au.currentTime=e.target.value/1000*au.duration};
$('#pp').onclick=toggle;$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
// Управление с экрана блокировки и из шторки
function setupMS(){
if('mediaSession' in navigator){
  const h=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}};
  h('play',resumePlay);
  h('pause',()=>{userPaused=true;au.pause()});
  h('previoustrack',()=>step(-1));
  h('nexttrack',()=>step(1));
  h('seekto',e=>{if(!isFinite(au.duration)||!au.duration)return;au.currentTime=Math.max(0,Math.min(e.seekTime,au.duration-.3));posState(1)});
  h('seekbackward',null);h('seekforward',null);
}}
setupMS();
const wake=()=>{if(!cur||userPaused)return;if(au.paused&&!au.ended&&au.src)resumePlay();else if(ctx&&ctx.state!=='running')ctx.resume().catch(()=>{})};
if(navigator.mediaDevices&&navigator.mediaDevices.addEventListener)navigator.mediaDevices.addEventListener('devicechange',()=>setTimeout(()=>{if(au.paused)userPaused=true},400));
document.addEventListener('visibilitychange',()=>{if(ctx&&!au.paused&&ctx.state!=='running')ctx.resume().catch(()=>{});if(!document.hidden)wake()});
addEventListener('pageshow',wake);addEventListener('focus',wake);
$('#stop').onclick=()=>{userPaused=true;au.pause();au.currentTime=0};
$('#save').onclick=()=>cur&&add(cur);
$('#shr').onclick=()=>cur&&share(cur);
$('#mode').onclick=()=>setMode((mode+1)%3,1);setMode(mode,0);

// --- Плейлист, оффлайн, шеринг ---
let addPending=null;
function addTo(i,t){const P=PLS[i];if(P.t.some(x=>x.id==t.id))return toast('Уже в «'+P.n+'»');P.t.push({...t,off:t.off||0});savePL();toast('Добавлено в «'+P.n+'»');render()}
function add(t){
  if(PLS.length<2)return addTo(0,t);
  addPending=t;
  $('#mdl').innerHTML=PLS.map((p,i)=>`<button class="b go" data-i="${i}" style="width:100%;margin:6px 0;font-size:11px">${esc(p.n)} (${p.t.length})</button>`).join('')+'<button class="b pk" data-i="new" style="width:100%;margin:6px 0;font-size:11px">＋ Новый плейлист</button>';
  $('#md').hidden=false;
}
function newPL(){const n=(prompt('Название плейлиста','Новый плейлист')||'').trim();if(!n)return null;PLS.push({n,t:[]});return PLS.length-1}
function switchPL(i){cp=((i%PLS.length)+PLS.length)%PLS.length;pl=PLS[cp].t;savePL();render()}
$('#mdl').onclick=e=>{const b=e.target.closest('button');if(!b||!addPending)return;let i=b.dataset.i;if(i=='new'){i=newPL();if(i==null)return}addTo(+i,addPending);addPending=null;$('#md').hidden=true};
$('#mdc').onclick=()=>{$('#md').hidden=true;addPending=null};
async function offline(t){
  if(t.radio)return toast('Радио нельзя сохранить');
  if(t.prev)return toast('Превью нельзя сохранить');
  if(t.video)return toast('Видео не сохраняется');
  toast('Записываю на кассету…');
  try{
    const r=await fetch(srcOf(t),{mode:'cors'});if(!r.ok)throw 0;
    await(await caches.open('tapes')).put(key(t.id),r);
    if(!pl.some(x=>x.id==t.id))pl.push({...t});
    pl.find(x=>x.id==t.id).off=1;savePL();loadBlobs();toast('Сохранено: играет без интернета');render();
  }catch(e){toast('Не удалось сохранить этот трек')}
}
async function share(t){
  if(t.id.startsWith('lo:'))return toast('Свой файл нельзя отправить ссылкой');
  const url=location.origin+location.pathname+'?t='+encodeURIComponent(t.id);
  try{if(navigator.share)return await navigator.share({title:t.title,text:(t.artist||'')+' — '+t.title,url})}catch(e){return}
  try{await navigator.clipboard.writeText(url);toast('Ссылка скопирована')}catch(e){prompt('Ссылка:',url)}
}
async function del(i){const t=pl[i];if(blobs.has(t.id)){URL.revokeObjectURL(blobs.get(t.id));blobs.delete(t.id)}try{await(await caches.open('tapes')).delete(key(t.id))}catch(e){}pl.splice(i,1);savePL();render()}

// --- Список ---
function tabs(){
  $('#t1').classList.toggle('on',tab==1);$('#t2').classList.toggle('on',tab==2);$('#t3').classList.toggle('on',tab==3);
  $('#q').placeholder=tab==3?'Название радиостанции':'Название или исполнитель';
}
function row(t,i,kind){
  const fav=kind==3&&isFav(t);
  const a1=kind==1?`<button data-a="a" data-i="${i}" aria-label="В плейлист">+</button>`:kind==2?`<button data-a="d" data-i="${i}" aria-label="Удалить">×</button>`:`<button class="${fav?'ok':''}" data-a="f" data-i="${i}" aria-label="Избранное">${fav?'♥':'♡'}</button>`;
  const a2=t.radio||t.prev||t.video?'':`<button class="${t.off?'ok':''}" data-a="o" data-i="${i}" aria-label="Сохранить для оффлайна">${t.off?'✔':'⬇'}</button>`;
  return `<div class="t${cur&&cur.id==t.id?' now':''}"><img data-a="p" data-i="${i}" alt="" src="${esc(t.cover||'')}" onerror="this.style.visibility='hidden'"><div class="i" data-a="p" data-i="${i}"><b>${esc(t.title)}</b><span>${esc(t.artist)}${t.dur?' · '+fmt(t.dur):''}</span><small>${esc(t.from||'')}${t.lic?' · '+esc(t.lic):''}${t.prev?' · превью 30 сек':''}</small></div><button class="more" data-a="m" aria-label="Действия">⋮</button><div class="act">${a1}${a2}<button data-a="s" data-i="${i}" aria-label="Поделиться">↗</button></div></div>`;
}
const chipH=(t,a,i)=>`<button class="ch" data-a="${a}" data-i="${i}">${esc(t)}</button>`;
function plHead(){
  return `<div class="plh"><button class="b" data-a="pp" aria-label="Предыдущий плейлист">‹</button><div class="plt"><b>${esc(PLS[cp].n)}</b><small>${cp+1} из ${PLS.length} · листай свайпом ← →</small></div><button class="b" data-a="pn" aria-label="Следующий плейлист">›</button></div><div class="chs"><button class="ch" data-a="pa">＋ Новый</button><button class="ch" data-a="pr">✎ Название</button><button class="ch" data-a="px">🗑 Удалить</button></div>`;
}
function renderRadio(){
  RL=[];
  const addRows=arr=>arr.map(t=>{RL.push(t);return row(t,RL.length-1,3)}).join('');
  let h='<p class="m h">♥ Избранные станции</p>'+(favs.length?addRows(favs):'<p class="m" style="padding:4px 0 10px">Пока пусто. Открой «⋮» у станции и нажми ♡</p>');
  h+=`<p class="m h">Подборки</p><div class="chs">${RADIO.map((m,i)=>chipH(m[0],'r',i)).join('')}</div>`;
  if(radioRes.length)h+=`<p class="m h">${esc(radioTitle)}</p>`+addRows(radioRes);
  h+='<p class="m h">Все страны</p>';
  if(!countriesC.length)h+='<p class="m">Загружаю список стран…</p>';
  countriesC.forEach(c=>{
    const open=openC==c.cc;
    h+=`<button class="cty${open?' on':''}" data-a="c" data-c="${c.cc}"><span>${flag(c.cc)} ${esc(c.name)}</span><i>${c.n}</i></button>`;
    if(open)h+=cst[c.cc]?(cst[c.cc].length?addRows(cst[c.cc]):'<p class="m">Станции не найдены</p>'):'<p class="m">Загружаю…</p>';
  });
  $('#list').innerHTML=h;
}
function render(){
  if(tab==3)return renderRadio();
  const L=tab==1?results:pl,head=tab==2?plHead():'';
  if(!L.length){$('#list').innerHTML=head+(tab==1?homeHtml():'<p class="m">Плейлист пуст. Жми «⋮» → «+» у трека</p>');return}
  $('#list').innerHTML=head+L.map((t,i)=>`${tab==1&&t.v&&(i==0||!L[i-1].v)?'<p class="m" style="padding:8px">— Ремиксы и другие версии —</p>':''}${row(t,i,tab)}`).join('');
}
$('#list').onclick=async e=>{
  if(Date.now()<noClick)return;
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,row=b.closest('.t');
  if(a=='q'){$('#q').value=b.dataset.q;search(b.dataset.q);return}
  if(a=='g'){explore(+b.dataset.i);return}
  if(a=='r'){exploreRadio(+b.dataset.i);return}
  if(a=='pp'){switchPL(cp-1);return}
  if(a=='pn'){switchPL(cp+1);return}
  if(a=='pa'){const k=newPL();if(k!=null)switchPL(k);return}
  if(a=='pr'){const n=(prompt('Новое название',PLS[cp].n)||'').trim();if(n){PLS[cp].n=n;savePL();render()}return}
  if(a=='px'){if(PLS.length<2)return toast('Нужен хотя бы один плейлист');if(confirm('Удалить плейлист «'+PLS[cp].n+'»?')){PLS.splice(cp,1);cp=Math.min(cp,PLS.length-1);switchPL(cp)}return}
  if(a=='c'){const cc=b.dataset.c;openC=openC==cc?'':cc;renderRadio();if(openC&&!cst[cc]){cst[cc]=await radioList('countrycode='+cc,100);renderRadio()}return}
  if(a=='m'){const o=row.classList.contains('open');document.querySelectorAll('.t.open').forEach(r=>r.classList.remove('open'));if(!o)row.classList.add('open');return}
  if(a=='x'){row.classList.remove('open');return}
  const L=tab==1?results:tab==2?pl:RL,i=+b.dataset.i;
  if(a=='p'){
    const same=cur&&L[i].id===cur.id;
    if(same&&au.src){if(queue!==L){queue=L;qi=i;hist=[]}if(au.paused)resumePlay()}
    else if(same)play(L,i,true,pendingPos);
    else play(L,i);
  }else if(a=='a')add(L[i]);else if(a=='o')offline(L[i]);else if(a=='s')share(L[i]);else if(a=='d')del(i);else if(a=='f')toggleFav(L[i]);
  row.classList.remove('open');
};
document.addEventListener('click',e=>{if(!e.target.closest('.t.open'))document.querySelectorAll('.t.open').forEach(r=>r.classList.remove('open'))});
// Перестановка: зажми трек и тяни
$('#list').addEventListener('pointerdown',e=>{
  const row=e.target.closest('.t');
  if(!row||dr||tab==3||e.target.closest('button')||row.classList.contains('open'))return;
  dr={row,x:e.clientX,y:e.clientY,ly:e.clientY,on:false};
  dr.tm=setTimeout(()=>{
    const rows=[...document.querySelectorAll('#list .t')],n=rows.length;
    if(n<2){dr=null;return}
    const tops=rows.map(r=>r.getBoundingClientRect().top+scrollY),idx=rows.indexOf(row);
    Object.assign(dr,{on:true,rows,idx,ni:idx,pitch:(tops[n-1]-tops[0])/(n-1),y0:dr.ly,s0:scrollY});
    row.classList.add('drag');if(navigator.vibrate)navigator.vibrate(15);
  },380);
});
addEventListener('pointermove',e=>{
  if(!dr)return;dr.ly=e.clientY;
  if(!dr.on){if(Math.abs(e.clientY-dr.y)>8||Math.abs(e.clientX-dr.x)>8){clearTimeout(dr.tm);dr=null}return}
  if(e.clientY<90)scrollBy(0,-10);else if(e.clientY>innerHeight-90)scrollBy(0,10);
  const dy=e.clientY-dr.y0+scrollY-dr.s0,n=dr.rows.length;
  dr.row.style.transform=`translateY(${dy}px)`;
  dr.ni=Math.max(0,Math.min(n-1,Math.round(dr.idx+dy/dr.pitch)));
  dr.rows.forEach((r,j)=>{if(j==dr.idx)return;let sh=0;
    if(dr.ni>dr.idx&&j>dr.idx&&j<=dr.ni)sh=-dr.pitch;else if(dr.ni<dr.idx&&j<dr.idx&&j>=dr.ni)sh=dr.pitch;
    r.style.transform=sh?`translateY(${sh}px)`:''});
});
function endDrag(){
  if(!dr)return;clearTimeout(dr.tm);
  if(dr.on){
    noClick=Date.now()+400;
    dr.rows.forEach(r=>{r.style.transform='';r.classList.remove('drag')});
    if(dr.ni!=dr.idx){
      const L=tab==1?results:pl,[m]=L.splice(dr.idx,1);L.splice(dr.ni,0,m);hist=[];
      if(queue===L&&cur){const k=L.findIndex(x=>x.id==cur.id);if(k>=0)qi=k}
      if(tab==2)savePL();render();
    }
  }
  dr=null;
}
addEventListener('pointerup',endDrag);addEventListener('pointercancel',endDrag);
addEventListener('touchmove',e=>{if(dr&&dr.on)e.preventDefault()},{passive:false});
$('#fi').onchange=async e=>{
  let n=0;
  try{
    const c=await caches.open('tapes');
    for(const f of e.target.files){
      const id='lo:'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      try{await c.put(key(id),new Response(f,{headers:{'Content-Type':f.type||'audio/mpeg'}}));pl.push({id,title:f.name.replace(/\.[^.]+$/,''),artist:'Мой файл',cover:'',dur:0,off:1});n++}catch(err){}
    }
  }catch(err){}
  e.target.value='';savePL();await loadBlobs();tab=2;tabs();render();toast(n?'Добавлено файлов: '+n:'Не удалось добавить');
};
$('#t1').onclick=()=>{tab=1;tabs();render()};
$('#t2').onclick=()=>{tab=2;tabs();render()};
$('#t3').onclick=()=>{tab=3;tabs();render();if(!countriesC.length)loadCountries().then(()=>{if(tab==3)render()})};
let sx=0,sy=0,s0=0;
$('#list').addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;s0=Date.now()},{passive:true});
$('#list').addEventListener('touchend',e=>{
  if(tab!=2||(dr&&dr.on)||Date.now()<noClick||document.querySelector('.t.open'))return;
  const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)>70&&Math.abs(dx)>2*Math.abs(dy)&&Date.now()-s0<600)switchPL(dx<0?cp+1:cp-1);
});
$('#f').onsubmit=e=>{e.preventDefault();const q=$('#q').value.trim();showSg([]);if(q){if(tab==3)radioSearch(q);else search(q)}};
function showSg(items){const g=$('#sg');if(!items.length){g.hidden=true;return}g.innerHTML=items.map(x=>`<div class="sgi" data-q="${esc(x)}">${esc(x)}</div>`).join('');g.hidden=false}
async function suggest(v){
  const my=++sgSeq,low=v.toLowerCase();
  const hs=qh.filter(x=>x.toLowerCase().startsWith(low)&&x.toLowerCase()!==low).slice(0,3);
  const A=fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(v)}&entity=musicArtist&limit=12&country=RU`).then(r=>r.json()).then(j=>j.results.map(d=>d.artistName)).catch(()=>[]);
  const B=host().then(h=>fetch(`${h}/v1/users/search?query=${encodeURIComponent(v)}&limit=6&app_name=${APP}`)).then(r=>r.json()).then(j=>j.data.map(d=>d.name)).catch(()=>[]);
  const arts=[...(await A),...(await B)].filter(Boolean);
  if(my!==sgSeq)return;
  const st=arts.filter(n=>n.toLowerCase().startsWith(low)),rest=arts.filter(n=>!n.toLowerCase().startsWith(low));
  showSg([...new Set([...hs,...st,...rest])].slice(0,8));
}
let sgT;
$('#q').oninput=e=>{const v=e.target.value.trim();$('#qx').hidden=!e.target.value;clearTimeout(sgT);if(!v||tab==3){sgSeq++;showSg([]);return}sgT=setTimeout(()=>suggest(v),250)};
$('#qx').onclick=()=>{const q=$('#q');q.value='';$('#qx').hidden=true;sgSeq++;showSg([]);lastQ='';radioRes=[];if(tab!=3){results=[];tab=1}tabs();render();q.focus()};
$('#sg').onclick=e=>{const d=e.target.closest('.sgi');if(!d)return;$('#q').value=d.dataset.q;showSg([]);search(d.dataset.q)};
document.addEventListener('click',e=>{if(!e.target.closest('.sb'))$('#sg').hidden=true});

// --- Открытие по ссылке ?t=... ---
(async()=>{
  const id=new URLSearchParams(location.search).get('t');
  if(!id){try{
    const st=JSON.parse(localStorage.getItem('tape_state')||'null');
    if(st&&st.cur){
      const isPl=typeof st.q==='string'&&st.q.startsWith('pl');
      let q=isPl?(PLS[+st.q.slice(3)||0]||PLS[0]).t:(Array.isArray(st.q)&&st.q.length?st.q:[st.cur]),k=q.findIndex(x=>x.id==st.cur.id);
      if(k<0){q=[st.cur];k=0}
      queue=q;qi=k;cur=q[k];pendingPos=st.pos||0;
      const pk=PLS.findIndex(p=>p.t===q);
      if(pk>=0){cp=pk;pl=PLS[cp].t;tab=2;tabs()}else if(q.length>1&&!cur.radio)results=q;
      ui();$('#tm').textContent=fmt(pendingPos);
    }
  }catch(e){}}
  if(id){const t=await byId(id);if(t){results=[t];queue=results;qi=0;cur=t;ui();toast('Жми ▶ — тебе скинули трек')}}
  if(!navigator.onLine&&pl.length){tab=2;tabs()}
  fillDL();host();loadBlobs();render();loadCharts().then(()=>{if(tab==1&&!results.length&&!lastQ)render()});
})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
