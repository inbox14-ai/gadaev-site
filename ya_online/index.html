<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ya Online — Видеозвонки</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .top-bar {
            background: rgba(30, 41, 59, 0.95);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
        }
        .room-info { font-size: 11px; color: #94a3b8; }
        .room-info strong { color: #60a5fa; }
        .controls { display: flex; gap: 6px; }
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn.off { background: #dc2626; }
        
        .room-details {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 10px;
            border-radius: 8px;
            margin: 8px;
            font-size: 12px;
        }
        .room-details .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 4px 0;
            flex-wrap: wrap;
            gap: 4px;
        }
        .room-details .label { color: #94a3b8; }
        .room-details .value { color: #60a5fa; font-family: monospace; font-weight: bold; word-break: break-all; }
        .copy-btn {
            background: rgba(59, 130, 246, 0.3);
            color: #60a5fa;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
        }
        
        .status-bar {
            padding: 8px;
            text-align: center;
            font-size: 12px;
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            margin: 0 8px;
            border-radius: 6px;
        }
        
        .video-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 8px;
            gap: 8px;
        }
        .main-video {
            flex: 2;
            background: #000;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            min-height: 0;
        }
        .main-video video { width: 100%; height: 100%; object-fit: cover; }
        .main-video .label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.8);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .main-video .speaking-indicator {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .main-video.manual-mode .label::after { content: ''; margin-left: 4px; }
        
        .video-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 6px;
            overflow-y: auto;
            min-height: 100px;
        }
        .video-item {
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            aspect-ratio: 4/3;
        }
        .video-item:hover { transform: scale(1.05); box-shadow: 0 0 0 2px #3b82f6; }
        .video-item.selected { box-shadow: 0 0 0 3px #10b981; }
        .video-item.speaking { box-shadow: 0 0 0 2px #10b981; }
        .video-item video { width: 100%; height: 100%; object-fit: cover; }
        .video-item .label {
            position: absolute;
            bottom: 4px;
            left: 4px;
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .video-item .speaking-indicator {
            width: 6px;
            height: 6px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 1s infinite;
            display: none;
        }
        .video-item.speaking .speaking-indicator { display: block; }
        .volume-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: #10b981;
            transition: width 0.1s;
        }
        
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1e293b;
            padding: 24px;
            border-radius: 16px;
            max-width: 400px;
            width: 90%;
        }
        .modal h2 { margin-bottom: 16px; text-align: center; }
        .modal input {
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .modal button {
            width: 100%;
            padding: 12px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="modal" id="joinModal">
        <div class="modal-content">
            <h2>🎥 Ya Online</h2>
            <input type="text" id="joinRoomId" placeholder="ID комнаты (пусто = создать)">
            <input type="password" id="joinPassword" placeholder="Пароль">
            <button onclick="startCall()">Войти</button>
        </div>
    </div>

    <div class="top-bar">
        <div class="room-info">
            Комната: <strong id="roomIdDisplay">—</strong> | 
            Участников: <strong id="peerCount">1</strong>
        </div>
        <div class="controls">
            <button class="btn btn-primary" id="toggleVideo" onclick="toggleVideo()">📹</button>
            <button class="btn btn-primary" id="toggleAudio" onclick="toggleAudio()"></button>
            <button class="btn btn-danger" onclick="leaveRoom()">🚪</button>
        </div>
    </div>

    <div class="room-details" id="roomDetails">
        <div class="row">
            <span class="label">ID комнаты:</span>
            <span class="value" id="displayRoomId">—</span>
            <button class="copy-btn" onclick="copyField('displayRoomId')">📋</button>
        </div>
        <div class="row">
            <span class="label">Пароль:</span>
            <span class="value" id="displayPassword">—</span>
            <button class="copy-btn" onclick="copyField('displayPassword')">📋</button>
        </div>
        <div class="row">
            <span class="label">Ссылка:</span>
            <button class="copy-btn" onclick="copyLink()" style="flex:1; margin-left:8px;">📋 Копировать ссылку-приглашение</button>
        </div>
    </div>

    <div class="status-bar" id="statusBar">Подключение к сети...</div>

    <div class="video-container">
        <div class="main-video" id="mainVideo">
            <video id="mainVideoElement" autoplay playsinline></video>
            <div class="label">
                <span class="speaking-indicator"></span>
                <span id="mainVideoLabel">Ожидание...</span>
            </div>
        </div>

        <div class="video-grid" id="videoGrid"></div>
    </div>

    <!-- Trystero вместо PeerJS -->
    <script src="https://cdn.jsdelivr.net/npm/trystero@0.20.0/dist/trystero.min.js"></script>
    <script>
        let room = null;
        let localStream = null;
        let currentRoomId = '';
        let roomPassword = '';
        let participants = {}; // {peerId: {stream, videoElement, volumeBar, ...}}
        let selectedPeerId = null;
        let activeSpeakerPeerId = null;
        let isManualMode = false;
        const SPEAKING_THRESHOLD = 30;
        const APP_ID = 'gadaev_pro_ya_online_v1'; // Уникальный ID приложения

        function generateId() {
            return Math.random().toString(36).substring(2, 8);
        }

        function setStatus(msg) {
            document.getElementById('statusBar').textContent = msg;
        }

        function log(msg) {
            console.log('[YaOnline]', msg);
        }

        async function startCall() {
            const roomId = document.getElementById('joinRoomId').value.trim();
            const password = document.getElementById('joinPassword').value.trim();
            
            if (!password) {
                alert('Введите пароль');
                return;
            }
            
            currentRoomId = roomId || generateId();
            roomPassword = password;
            
            document.getElementById('roomIdDisplay').textContent = currentRoomId;
            document.getElementById('displayRoomId').textContent = currentRoomId;
            document.getElementById('displayPassword').textContent = roomPassword;
            document.getElementById('joinModal').classList.add('hidden');
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 15 } },
                    audio: { echoCancellation: true, noiseSuppression: true }
                });
                
                // Добавляем своё видео
                addParticipant('me', localStream, true);
                updateMainVideo();
                
                setStatus('🔗 Подключение к сети...');
                log('Создаём комнату: ' + currentRoomId);
                
                // Подключаемся через Trystero (без сервера!)
                const [joinRoom, leaveRoomFn, getPeers] = trystero.torrent({ appId: APP_ID });
                room = joinRoom({ room: currentRoomId, password: roomPassword });
                
                room.onPeerJoin((peerId, send, getStream) => {
                    log('Новый участник: ' + peerId);
                    
                    // Отправляем свой пароль для проверки
                    send({ type: 'hello', password: roomPassword });
                    
                    // Когда получим видео от нового участника
                    getStream().then(remoteStream => {
                        log('Получено видео от: ' + peerId);
                        addParticipant(peerId, remoteStream, false);
                        setStatus('✅ Участник подключился!');
                    }).catch(err => {
                        log('Ошибка получения видео: ' + err);
                    });
                });
                
                room.onPeerLeave((peerId) => {
                    log('Участник вышел: ' + peerId);
                    removeParticipant(peerId);
                });
                
                room.onData((data, peerId) => {
                    if (data.type === 'hello') {
                        if (data.password !== roomPassword) {
                            log('Неверный пароль от ' + peerId);
                            // Можно отключить, но Trystero сам разберётся
                        } else {
                            log('Пароль верный от ' + peerId);
                        }
                    }
                });
                
                setStatus('✅ В сети! Ожидаю участников...');
                log('Комната готова, ждём участников');
                
            } catch (err) {
                log('Ошибка: ' + err.message);
                setStatus('❌ Ошибка: ' + err.message);
                alert('Нет доступа к камере/микрофону: ' + err.message);
            }
        }

        function addParticipant(peerId, stream, isLocal) {
            participants[peerId] = {
                stream: stream,
                isLocal: isLocal
            };
            
            const grid = document.getElementById('videoGrid');
            const div = document.createElement('div');
            div.className = 'video-item';
            div.id = 'video_' + peerId;
            div.onclick = () => selectPeer(peerId);
            
            const video = document.createElement('video');
            video.srcObject = stream;
            video.autoplay = true;
            video.playsinline = true;
            if (isLocal) video.muted = true;
            
            const label = document.createElement('div');
            label.className = 'label';
            label.innerHTML = `<span class="speaking-indicator"></span>${isLocal ? 'Вы' : peerId.slice(-4)}`;
            
            const volumeBar = document.createElement('div');
            volumeBar.className = 'volume-bar';
            
            div.appendChild(video);
            div.appendChild(label);
            div.appendChild(volumeBar);
            grid.appendChild(div);
            
            participants[peerId].videoElement = div;
            participants[peerId].volumeBar = volumeBar;
            
            updatePeerCount();
        }

        function removeParticipant(peerId) {
            if (participants[peerId]) {
                const el = document.getElementById('video_' + peerId);
                if (el) el.remove();
                delete participants[peerId];
                
                if (selectedPeerId === peerId) {
                    selectedPeerId = null;
                    isManualMode = false;
                }
                if (activeSpeakerPeerId === peerId) {
                    activeSpeakerPeerId = null;
                }
                
                updatePeerCount();
                updateMainVideo();
            }
        }

        function selectPeer(peerId) {
            if (isManualMode && selectedPeerId === peerId) {
                isManualMode = false;
                selectedPeerId = null;
                document.getElementById('mainVideo').classList.remove('manual-mode');
            } else {
                isManualMode = true;
                selectedPeerId = peerId;
                document.getElementById('mainVideo').classList.add('manual-mode');
            }
            updateMainVideo();
        }

        function updateMainVideo() {
            const targetPeerId = isManualMode ? selectedPeerId : activeSpeakerPeerId;
            const mainVideo = document.getElementById('mainVideoElement');
            const mainLabel = document.getElementById('mainVideoLabel');
            
            if (targetPeerId && participants[targetPeerId]) {
                mainVideo.srcObject = participants[targetPeerId].stream;
                mainLabel.textContent = participants[targetPeerId].isLocal ? 'Вы' : targetPeerId.slice(-4);
            } else {
                mainVideo.srcObject = null;
                mainLabel.textContent = 'Ожидание...';
            }
            
            document.querySelectorAll('.video-item').forEach(el => el.classList.remove('selected'));
            if (targetPeerId) {
                const el = document.getElementById('video_' + targetPeerId);
                if (el) el.classList.add('selected');
            }
        }

        function updatePeerCount() {
            document.getElementById('peerCount').textContent = Object.keys(participants).length;
        }

        function copyField(elementId) {
            const text = document.getElementById(elementId).textContent;
            navigator.clipboard.writeText(text).then(() => {
                setStatus('📋 Скопировано: ' + text);
            }).catch(() => {
                prompt('Скопируйте:', text);
            });
        }

        function copyLink() {
            const link = location.origin + location.pathname + '?room=' + currentRoomId + '&pass=' + roomPassword;
            navigator.clipboard.writeText(link).then(() => {
                setStatus('📋 Ссылка скопирована!');
            }).catch(() => {
                prompt('Скопируйте ссылку:', link);
            });
        }

        function toggleVideo() {
            if (!localStream) return;
            const track = localStream.getVideoTracks()[0];
            track.enabled = !track.enabled;
            const btn = document.getElementById('toggleVideo');
            btn.textContent = track.enabled ? '📹' : '📹';
            btn.classList.toggle('off');
        }

        function toggleAudio() {
            if (!localStream) return;
            const track = localStream.getAudioTracks()[0];
            track.enabled = !track.enabled;
            const btn = document.getElementById('toggleAudio');
            btn.textContent = track.enabled ? '' : '🎤';
            btn.classList.toggle('off');
        }

        function leaveRoom() {
            if (room) room.leave();
            location.reload();
        }

        // Автозаполнение из URL
        const params = new URLSearchParams(location.search);
        if (params.get('room')) document.getElementById('joinRoomId').value = params.get('room');
        if (params.get('pass')) document.getElementById('joinPassword').value = params.get('pass');
    </script>
</body>
</html>
