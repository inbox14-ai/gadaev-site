<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ya Online — видеокомнаты</title>
<style>
*{box-sizing:border-box;margin:0}
body{font:15px -apple-system,Segoe UI,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100dvh}
.scr{display:none;padding:16px;max-width:760px;margin:0 auto}.scr.on{display:block}
#room.on{display:flex;flex-direction:column;height:100dvh;max-width:none;padding:8px}
h1{font-size:30px;text-align:center;margin:48px 0 6px}.sub{text-align:center;color:#94a3b8;margin-bottom:28px}
button,input,select,textarea{font:inherit}
.btn{border:0;border-radius:10px;padding:12px 16px;background:#3b82f6;color:#fff;font-weight:600;cursor:pointer}
.btn.g{background:#1e293b;color:#cbd5e1}.btn.r{background:#ef4444}.btn.off{background:#64748b}
.big{display:block;width:100%;padding:18px;margin:10px 0;font-size:17px}
input,select,textarea{width:100%;padding:12px;margin:6px 0;background:#1e293b;border:1px solid #334155;border-radius:10px;color:#fff}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.card{background:#1e293b;border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer}
.card small{color:#94a3b8}.card div{margin:2px 0;color:#cbd5e1}
.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:9}.modal.on{display:flex}
.mc{background:#0f172a;border:1px solid #334155;border-radius:16px;padding:20px;width:92%;max-width:400px}
.mc h3{margin-bottom:8px}.mc .btn{width:100%;margin-top:8px}
#grid{flex:1;display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));grid-auto-rows:1fr;min-height:0;padding:8px 0}
.tile{position:relative;background:#000;border-radius:12px;overflow:hidden;min-height:0}
.tile video{width:100%;height:100%;object-fit:cover}
.tile span{position:absolute;left:8px;bottom:8px;background:#000a;padding:3px 8px;border-radius:6px;font-size:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1e293b;border:1px solid #334155;padding:10px 16px;border-radius:10px;display:none;z-index:99;text-align:center}
</style>
</head>
<body>

<section class="scr on" id="home">
  <h1>🎥 Ya Online</h1>
  <p class="sub">Видеокомнаты по интересам</p>
  <button class="btn big" id="bCreate">Создать комнату</button>
  <button class="btn big g" id="bFind">Найти комнату</button>
  <button class="btn big g" id="bSet">Настройки</button>
</section>

<section class="scr" id="find">
  <button class="btn g" id="bBack">← Назад</button>
  <input id="fQ" placeholder="Поиск: авто, кошки, знакомства…">
  <div class="row">
    <select id="fT"><option value="all">Все</option><option value="open">Открытые</option><option value="closed">Закрытые</option></select>
    <input id="fCity" placeholder="Город"><input id="fCo" placeholder="Страна">
  </div>
  <div id="list"></div>
</section>

<section class="scr" id="room">
  <div class="row" style="flex:none">
    <b id="rT" style="flex:2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></b>
    <button class="btn g" id="bLink">🔗</button>
    <button class="btn" id="bMic">🎤</button>
    <button class="btn" id="bCam">📹</button>
    <button class="btn r" id="bLeave">Выйти</button>
  </div>
  <div id="grid"></div>
</section>

<div class="modal" id="cm"><div class="mc">
  <h3>Новая комната</h3>
  <input id="cName" placeholder="Название" maxlength="60">
  <textarea id="cDesc" rows="3" placeholder="О чём будете говорить?" maxlength="200"></textarea>
  <input id="cPass" type="password" placeholder="Пароль (пусто = открытая комната)">
  <button class="btn" id="cOk">Создать</button>
  <button class="btn g" data-close>Отмена</button>
</div></div>

<div class="modal" id="pm"><div class="mc">
  <h3 id="pT">Войти в комнату</h3>
  <input id="pPass" type="password" placeholder="Пароль">
  <button class="btn" id="pOk">Войти</button>
  <button class="btn g" data-close>Отмена</button>
</div></div>

<div class="modal" id="sm"><div class="mc">
  <h3>Настройки</h3>
  <input id="sName" placeholder="Ваше имя" maxlength="30">
  <input id="sCity" placeholder="Город" maxlength="40">
  <input id="sCo" placeholder="Страна" maxlength="40">
  <button class="btn" id="sOk">Сохранить</button>
  <button class="btn g" data-close>Закрыть</button>
</div></div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getDatabase, ref, set, get, push, remove, onValue, onChildAdded, onChildRemoved, onDisconnect } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

const app = initializeApp({
  apiKey: "AIzaSyCgN79lHGEri4txKJ6WXJkvkUYY_LRPny4",
  authDomain: "ya-online-video.firebaseapp.com",
  databaseURL: "https://ya-online-video-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ya-online-video",
  appId: "1:614548563069:web:b440e8c5ab56e97dbafd14"
});
const db = getDatabase(app), auth = getAuth(app);

// ===== ВСТАВЬТЕ СЮДА TURN (см. инструкцию). Без него часть пар не соединится =====
const ICE = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' }
  // , { urls: 'turn:ХОСТ:443?transport=tcp', username: 'ЛОГИН', credential: 'ПАРОЛЬ' }
];
const MAX = 4;

const $ = id => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x) e.textContent = x; return e; };
const show = id => document.querySelectorAll('.scr').forEach(e => e.classList.toggle('on', e.id === id));
const modal = (id, on) => $(id).classList.toggle('on', on);
let tt; const toast = m => { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(tt); tt = setTimeout(() => t.style.display = 'none', 3500); };
const sha = async s => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map(x => x.toString(16).padStart(2, '0')).join('');
const members = r => Object.keys((r && r.members) || {}).length;

let uid, stream, key, roomId, rooms = {}, peers = {}, names = {}, unsubs = [], pend = null, listOn = false;
const prof = JSON.parse(localStorage.yaProf || '{}');

// ---------- вход и главный экран ----------
signInAnonymously(auth).then(c => {
  uid = c.user.uid;
  const id = new URLSearchParams(location.search).get('room');
  if (id) join(id, null, true);
}).catch(() => toast('Включите Anonymous в Firebase → Authentication'));

document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => document.querySelectorAll('.modal').forEach(m => m.classList.remove('on')));
$('bCreate').onclick = () => modal('cm', true);
$('bSet').onclick = () => { $('sName').value = prof.name || ''; $('sCity').value = prof.city || ''; $('sCo').value = prof.country || ''; modal('sm', true); };
$('sOk').onclick = () => { prof.name = $('sName').value.trim(); prof.city = $('sCity').value.trim(); prof.country = $('sCo').value.trim(); localStorage.yaProf = JSON.stringify(prof); modal('sm', false); toast('Сохранено'); };
$('bBack').onclick = () => show('home');
$('bFind').onclick = () => {
  show('find');
  if (!listOn) { listOn = true; onValue(ref(db, 'rooms'), s => { rooms = s.val() || {}; render(); }); }
};
['fQ', 'fT', 'fCity', 'fCo'].forEach(i => $(i).oninput = render);

// ---------- список комнат ----------
function render() {
  const q = $('fQ').value.toLowerCase(), t = $('fT').value, ci = $('fCity').value.toLowerCase(), co = $('fCo').value.toLowerCase();
  const box = $('list'); box.textContent = '';
  const arr = Object.entries(rooms).map(([id, r]) => ({ id, ...r, n: members(r) }))
    .filter(r => (r.n || Date.now() - r.created < 12e4)
      && (t === 'all' || (t === 'open') === !r.locked)
      && ((r.name || '') + ' ' + (r.desc || '') + ' ' + (r.city || '')).toLowerCase().includes(q)
      && (r.city || '').toLowerCase().includes(ci)
      && (r.country || '').toLowerCase().includes(co))
    .sort((a, b) => b.n - a.n || b.created - a.created);
  if (!arr.length) { box.append(el('p', 'sub', 'Комнат нет — создайте свою')); return; }
  arr.forEach(r => {
    const c = el('div', 'card');
    c.append(el('b', '', (r.locked ? '🔒 ' : '🌐 ') + r.name), el('div', '', r.desc || ''),
      el('small', '', [r.city, r.country].filter(Boolean).join(', ') + (r.city || r.country ? ' · ' : '') + r.n + '/' + MAX));
    c.onclick = () => join(r.id, r, false);
    box.append(c);
  });
}

// ---------- создание и вход ----------
$('cOk').onclick = async () => {
  const name = $('cName').value.trim(), pass = $('cPass').value;
  if (!name) return toast('Введите название');
  const id = Math.random().toString(36).slice(2, 8);
  const meta = { name, desc: $('cDesc').value.trim(), city: prof.city || '', country: prof.country || '', locked: !!pass, owner: uid, created: Date.now() };
  if (pass) meta.chk = await sha('chk' + id + pass);
  try { await set(ref(db, 'rooms/' + id), meta); } catch (e) { return toast('Нет доступа к базе — проверьте правила'); }
  modal('cm', false);
  enter(id, meta, pass);
};

async function join(id, r, viaLink) {
  if (!r) { r = (await get(ref(db, 'rooms/' + id))).val(); if (!r) return toast('Комната не найдена'); }
  if (members(r) >= MAX) return toast('Комната заполнена (максимум ' + MAX + ')');
  if (!r.locked && !viaLink) return enter(id, r, '');
  pend = { id, r };
  $('pT').textContent = r.name;
  $('pPass').value = ''; $('pPass').style.display = r.locked ? '' : 'none';
  modal('pm', true);
}
$('pOk').onclick = async () => {
  const { id, r } = pend, p = $('pPass').value;
  if (r.locked && await sha('chk' + id + p) !== r.chk) return toast('Неверный пароль');
  modal('pm', false); enter(id, r, p);
};

// ---------- комната и WebRTC (mesh) ----------
async function enter(id, r, pass) {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, frameRate: 15 }, audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (e) { return toast('Нет доступа к камере или микрофону'); }
  roomId = id;
  key = r.locked ? id + '_' + (await sha('k' + id + pass)).slice(0, 24) : id;
  $('rT').textContent = r.name;
  show('room');
  tile('me', stream, 'Вы');

  const base = 'signals/' + key;
  // сначала слушаем входящие, потом объявляем себя
  unsubs.push(onChildAdded(ref(db, base + '/msg/' + uid), onMsg));
  unsubs.push(onChildAdded(ref(db, base + '/peers'), s => {
    if (s.key === uid) return;
    names[s.key] = s.val().n;
    if (uid > s.key) call(s.key);           // звонит тот, у кого uid больше — исключает встречные offer
  }));
  unsubs.push(onChildRemoved(ref(db, base + '/peers'), s => closePeer(s.key)));

  const mref = ref(db, 'rooms/' + id + '/members/' + uid), pref = ref(db, base + '/peers/' + uid);
  await set(mref, true); onDisconnect(mref).remove();
  await set(pref, { n: prof.name || 'Гость' }); onDisconnect(pref).remove();
}

const send = (to, type, data) => push(ref(db, `signals/${key}/msg/${to}`), { from: uid, type, data: JSON.stringify(data) });

function mk(pid) {
  closePeer(pid, true);
  const pc = new RTCPeerConnection({ iceServers: ICE }), p = peers[pid] = { pc, q: [] };
  stream.getTracks().forEach(t => pc.addTrack(t, stream));
  pc.onicecandidate = e => e.candidate && send(pid, 'ice', e.candidate.toJSON());
  pc.ontrack = e => tile(pid, e.streams[0], names[pid] || 'Гость');
  pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed') toast('Не удалось соединиться с ' + (names[pid] || 'участником') + ' (нужен TURN)'); };
  return p;
}
async function call(pid) {
  const p = mk(pid), o = await p.pc.createOffer();
  await p.pc.setLocalDescription(o);
  send(pid, 'offer', { type: o.type, sdp: o.sdp });
}
const flush = p => { p.q.splice(0).forEach(c => p.pc.addIceCandidate(c).catch(() => {})); };

async function onMsg(s) {
  const m = s.val(); remove(s.ref);
  const d = JSON.parse(m.data);
  if (m.type === 'offer') {
    const p = mk(m.from);
    await p.pc.setRemoteDescription(d); flush(p);
    const a = await p.pc.createAnswer(); await p.pc.setLocalDescription(a);
    send(m.from, 'answer', { type: a.type, sdp: a.sdp });
  } else if (m.type === 'answer') {
    const p = peers[m.from]; if (p) { await p.pc.setRemoteDescription(d); flush(p); }
  } else {
    const p = peers[m.from]; if (!p) return;
    p.pc.remoteDescription ? p.pc.addIceCandidate(d).catch(() => {}) : p.q.push(d);
  }
}

function tile(id, st, label) {
  let t = $('t_' + id);
  if (!t) {
    t = el('div', 'tile'); t.id = 't_' + id;
    const v = document.createElement('video'); v.autoplay = true; v.playsInline = true; if (id === 'me') v.muted = true;
    t.append(v, el('span', '', label)); $('grid').append(t);
  }
  t.querySelector('video').srcObject = st;
}
function closePeer(pid, keepTile) {
  const p = peers[pid]; if (p) { p.pc.close(); delete peers[pid]; }
  if (!keepTile) { const t = $('t_' + pid); if (t) t.remove(); }
}

$('bMic').onclick = e => { const t = stream.getAudioTracks()[0]; t.enabled = !t.enabled; e.target.classList.toggle('off', !t.enabled); };
$('bCam').onclick = e => { const t = stream.getVideoTracks()[0]; t.enabled = !t.enabled; e.target.classList.toggle('off', !t.enabled); };
$('bLink').onclick = () => {
  const l = location.origin + location.pathname + '?room=' + roomId;
  navigator.clipboard.writeText(l).then(() => toast('Ссылка скопирована (пароль отправьте отдельно)')).catch(() => prompt('Ссылка:', l));
};
$('bLeave').onclick = async () => {
  unsubs.forEach(u => u()); Object.keys(peers).forEach(p => closePeer(p));
  stream && stream.getTracks().forEach(t => t.stop());
  const m = (await get(ref(db, 'rooms/' + roomId + '/members'))).val() || {};
  const last = Object.keys(m).every(k => k === uid);
  await Promise.all([remove(ref(db, 'rooms/' + roomId + '/members/' + uid)), remove(ref(db, `signals/${key}/peers/${uid}`))]).catch(() => {});
  if (last) await Promise.all([remove(ref(db, 'rooms/' + roomId)), remove(ref(db, 'signals/' + key))]).catch(() => {});
  location.href = location.pathname;
};
</script>
</body>
</html>
