<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ya Online — Видеозвонки</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 16px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 20px; font-size: 24px; }
        
        .card {
            background: rgba(30, 41, 59, 0.7);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1e293b;
            padding: 24px;
            border-radius: 16px;
            max-width: 400px;
            width: 90%;
        }
        .modal h2 { margin-bottom: 16px; text-align: center; }
        .modal input {
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .modal button {
            width: 100%;
            padding: 12px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 8px;
        }
        .modal .secondary-btn {
            background: #475569;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
        }
        .info-row:last-child { border-bottom: none; }
        .label { color: #94a3b8; font-size: 13px; }
        .value { font-family: monospace; color: #60a5fa; font-weight: bold; word-break: break-all; }
        
        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin: 4px;
        }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-warning { background: #f59e0b; color: white; }
        
        .status {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 13px;
            text-align: center;
        }
        .status.ok { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .status.warn { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .status.err { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .status.info { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        
        video {
            width: 100%;
            border-radius: 10px;
            background: #000;
            margin: 8px 0;
            aspect-ratio: 4/3;
            object-fit: cover;
        }
        
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 8px;
        }
        
        .log {
            background: rgba(0, 0, 0, 0.5);
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 11px;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 12px;
        }
        .log-entry { margin: 4px 0; color: #94a3b8; }
        .log-entry.error { color: #ef4444; }
        .log-entry.success { color: #10b981; }
        .log-entry.info { color: #60a5fa; }
    </style>
</head>
<body>
    <div class="modal" id="joinModal">
        <div class="modal-content">
            <h2> Ya Online</h2>
            <input type="text" id="joinRoomId" placeholder="ID комнаты (пусто = создать)">
            <input type="password" id="joinPassword" placeholder="Пароль">
            <button onclick="startCall()">Войти</button>
            <button class="secondary-btn" onclick="testConnection()">🔍 Тест соединения</button>
        </div>
    </div>

    <div class="container" id="mainContainer" style="display:none;">
        <h1>🎥 Ya Online</h1>
        
        <div id="status" class="status info">Инициализация...</div>

        <div class="card">
            <div class="info-row">
                <span class="label">ID комнаты:</span>
                <span class="value" id="displayRoomId">—</span>
                <button class="btn btn-primary" onclick="copyText('displayRoomId')">📋</button>
            </div>
            <div class="info-row">
                <span class="label">Пароль:</span>
                <span class="value" id="displayPassword">—</span>
                <button class="btn btn-primary" onclick="copyText('displayPassword')">📋</button>
            </div>
            <div class="info-row">
                <span class="label">Ваш Peer ID:</span>
                <span class="value" id="displayPeerId">—</span>
            </div>
            <button class="btn btn-success" onclick="copyLink()" style="width:100%; margin-top:8px;"> Копировать ссылку-приглашение</button>
        </div>

        <div class="card">
            <h3 style="margin-bottom:12px;">Управление</h3>
            <button class="btn btn-primary" id="toggleVideo" onclick="toggleVideo()">📹 Камера</button>
            <button class="btn btn-primary" id="toggleAudio" onclick="toggleAudio()">🎤 Микрофон</button>
            <button class="btn btn-warning" onclick="retryConnection()">🔄 Переподключиться</button>
            <button class="btn btn-danger" onclick="leaveRoom()">🚪 Выйти</button>
        </div>

        <h3 style="margin:16px 0 8px;">Вы:</h3>
        <video id="localVideo" autoplay muted playsinline></video>

        <h3 style="margin:16px 0 8px;">Собеседники:</h3>
        <div class="video-grid" id="remoteVideos"></div>

        <div class="log" id="log"></div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        let peer;
        let localStream;
        let currentRoomId = '';
        let roomPassword = '';
        let myPeerId = '';
        let isCreator = false;
        let connections = {};

        function log(msg, type = 'info') {
            const logEl = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + type;
            const time = new Date().toLocaleTimeString();
            entry.textContent = `[${time}] ${msg}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
            console.log(`[${type}] ${msg}`);
        }

        function setStatus(msg, type = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = msg;
            statusEl.className = 'status ' + type;
        }

        function generateId() {
            return Math.random().toString(36).substring(2, 8);
        }

        async function startCall() {
            const roomId = document.getElementById('joinRoomId').value.trim();
            const password = document.getElementById('joinPassword').value.trim();
            
            if (!password) {
                alert('Введите пароль');
                return;
            }
            
            isCreator = !roomId;
            currentRoomId = roomId || generateId();
            roomPassword = password;
            
            document.getElementById('displayRoomId').textContent = currentRoomId;
            document.getElementById('displayPassword').textContent = roomPassword;
            document.getElementById('joinModal').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'block';
            
            log('Начинаем подключение...', 'info');
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 15 } },
                    audio: { echoCancellation: true, noiseSuppression: true }
                });
                document.getElementById('localVideo').srcObject = localStream;
                log('Камера и микрофон получены', 'success');
                
                myPeerId = 'yo_' + currentRoomId + (isCreator ? '' : '_' + generateId());
                log('Мой Peer ID: ' + myPeerId, 'info');
                document.getElementById('displayPeerId').textContent = myPeerId;
                
                initPeer();
                
                if (isCreator) {
                    setStatus('✅ Комната создана! Ожидаю подключения...', 'ok');
                    log('Создатель комнаты готов к приёму звонков', 'success');
                } else {
                    setStatus('🔗 Подключаюсь к комнате...', 'info');
                    setTimeout(() => connectToCreator(), 2000);
                }
            } catch (err) {
                log('Ошибка доступа к медиа: ' + err.message, 'error');
                setStatus('❌ Нет доступа к камере/микрофону', 'err');
            }
        }

        function initPeer() {
            log('Инициализация PeerJS...', 'info');
            
            peer = new Peer(myPeerId, {
                debug: 2,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' },
                        { urls: 'stun:stun3.l.google.com:19302' },
                        { urls: 'stun:stun4.l.google.com:19302' },
                        { urls: 'stun:stun.services.mozilla.com' },
                        { urls: 'stun:stunserver.org' }
                    ]
                }
            });

            peer.on('open', (id) => {
                log('PeerJS подключён! ID: ' + id, 'success');
                setStatus('✅ Готов к звонкам', 'ok');
            });

            peer.on('call', (call) => {
                log('Входящий звонок от: ' + call.peer, 'info');
                
                const pwd = prompt('📞 Входящий звонок!\nВведите пароль комнаты:');
                
                if (pwd === roomPassword) {
                    log('Пароль верный, принимаю звонок', 'success');
                    call.answer(localStream);
                    handleCall(call);
                } else {
                    log('Неверный пароль, отклоняю звонок', 'error');
                    call.close();
                    setStatus(' Неверный пароль!', 'err');
                }
            });

            peer.on('connection', (conn) => {
                log('Data соединение от: ' + conn.peer, 'info');
                conn.on('data', (data) => {
                    log('Получены данные: ' + JSON.stringify(data), 'info');
                });
            });

            peer.on('error', (err) => {
                log('Ошибка PeerJS: ' + err.type + ' - ' + err.message, 'error');
                
                if (err.type === 'unavailable-id') {
                    setStatus('❌ ID уже занят. Попробуйте другой код комнаты', 'err');
                } else if (err.type === 'peer-unavailable') {
                    setStatus('❌ Собеседник не найден. Проверьте ID комнаты', 'err');
                } else if (err.type === 'network') {
                    setStatus('❌ Сетевая ошибка. Проверьте интернет', 'err');
                } else if (err.type === 'server-error') {
                    setStatus('❌ Ошибка сервера PeerJS. Попробуйте позже', 'err');
                } else {
                    setStatus('❌ Ошибка: ' + err.type, 'err');
                }
            });

            peer.on('disconnected', () => {
                log('PeerJS отключён, пытаюсь переподключиться...', 'warn');
                setStatus('⚠️ Соединение потеряно, переподключение...', 'warn');
                if (!peer.destroyed) {
                    peer.reconnect();
                }
            });

            peer.on('close', () => {
                log('PeerJS закрыт', 'warn');
            });
        }

        function connectToCreator() {
            const creatorId = 'yo_' + currentRoomId;
            log('Звоню создателю: ' + creatorId, 'info');
            setStatus('📞 Звоню создателю...', 'info');
            
            const call = peer.call(creatorId, localStream);
            
            if (call) {
                log('Звонок инициирован', 'info');
                handleCall(call);
                
                setTimeout(() => {
                    if (!connections[creatorId]) {
                        log('Звонок не принят за 10 секунд', 'warn');
                        setStatus('⚠️ Создатель не отвечает. Проверьте, что он онлайн', 'warn');
                    }
                }, 10000);
            } else {
                log('Не удалось инициировать звонок', 'error');
                setStatus(' Не удалось позвонить', 'err');
            }
        }

        function handleCall(call) {
            log('Обработка звонка с: ' + call.peer, 'info');
            
            call.on('stream', (remoteStream) => {
                log('Получен видеопоток от: ' + call.peer, 'success');
                addRemoteVideo(call.peer, remoteStream);
                setStatus('✅ Связь установлена!', 'ok');
            });

            call.on('close', () => {
                log('Звонок закрыт: ' + call.peer, 'warn');
                removeRemoteVideo(call.peer);
                setStatus('⚠️ Собеседник отключился', 'warn');
            });
            
            call.on('error', (err) => {
                log('Ошибка звонка: ' + err, 'error');
                setStatus('❌ Ошибка звонка', 'err');
            });
            
            connections[call.peer] = call;
        }

        function addRemoteVideo(peerId, stream) {
            const grid = document.getElementById('remoteVideos');
            const container = document.createElement('div');
            container.id = 'remote_' + peerId;
            
            const video = document.createElement('video');
            video.srcObject = stream;
            video.autoplay = true;
            video.playsinline = true;
            
            const label = document.createElement('div');
            label.style.cssText = 'position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,0.7);padding:4px 8px;border-radius:4px;font-size:12px;';
            label.textContent = peerId.slice(-6);
            
            container.style.position = 'relative';
            container.appendChild(video);
            container.appendChild(label);
            grid.appendChild(container);
            
            log('Добавлено видео от: ' + peerId, 'success');
        }

        function removeRemoteVideo(peerId) {
            const el = document.getElementById('remote_' + peerId);
            if (el) {
                el.remove();
                delete connections[peerId];
                log('Удалено видео: ' + peerId, 'info');
            }
        }

        function retryConnection() {
            log('Переподключение...', 'info');
            setStatus('🔄 Переподключение...', 'info');
            
            if (!isCreator) {
                connectToCreator();
            } else {
                setStatus('✅ Вы создатель, ожидание подключений...', 'ok');
            }
        }

        function copyText(elementId) {
            const text = document.getElementById(elementId).textContent;
            navigator.clipboard.writeText(text).then(() => {
                setStatus('📋 Скопировано: ' + text, 'ok');
                log('Скопировано: ' + text, 'info');
            }).catch(() => {
                prompt('Скопируйте:', text);
            });
        }

        function copyLink() {
            const link = location.origin + location.pathname + '?room=' + currentRoomId + '&pass=' + roomPassword;
            navigator.clipboard.writeText(link).then(() => {
                setStatus('📋 Ссылка скопирована!', 'ok');
                log('Ссылка скопирована', 'success');
            }).catch(() => {
                prompt('Скопируйте ссылку:', link);
            });
        }

        function toggleVideo() {
            if (!localStream) return;
            const track = localStream.getVideoTracks()[0];
            track.enabled = !track.enabled;
            const btn = document.getElementById('toggleVideo');
            btn.textContent = track.enabled ? '📹 Камера' : ' Выкл';
            log('Видео: ' + (track.enabled ? 'вкл' : 'выкл'), 'info');
        }

        function toggleAudio() {
            if (!localStream) return;
            const track = localStream.getAudioTracks()[0];
            track.enabled = !track.enabled;
            const btn = document.getElementById('toggleAudio');
            btn.textContent = track.enabled ? '🎤 Микрофон' : '🎤 Выкл';
            log('Аудио: ' + (track.enabled ? 'вкл' : 'выкл'), 'info');
        }

        function leaveRoom() {
            log('Выход из комнаты', 'info');
            Object.values(connections).forEach(call => call.close());
            if (peer) peer.destroy();
            location.reload();
        }

        async function testConnection() {
            log('Тест соединения с PeerJS сервером...', 'info');
            setStatus('🔍 Тестирование...', 'info');
            
            try {
                const testPeer = new Peer('test_' + generateId(), {
                    debug: 2,
                    config: {
                        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                    }
                });
                
                testPeer.on('open', (id) => {
                    log('✅ PeerJS сервер доступен! Тестовый ID: ' + id, 'success');
                    setStatus('✅ PeerJS работает корректно', 'ok');
                    testPeer.destroy();
                });
                
                testPeer.on('error', (err) => {
                    log('❌ PeerJS сервер недоступен: ' + err.type, 'error');
                    setStatus('❌ PeerJS недоступен. Проблема с сервером', 'err');
                });
                
                setTimeout(() => {
                    if (!testPeer.destroyed) {
                        testPeer.destroy();
                    }
                }, 5000);
            } catch (err) {
                log('Ошибка теста: ' + err.message, 'error');
            }
        }

        // Автозаполнение из URL
        const params = new URLSearchParams(location.search);
        if (params.get('room')) document.getElementById('joinRoomId').value = params.get('room');
        if (params.get('pass')) document.getElementById('joinPassword').value = params.get('pass');
        
        log('Страница загружена', 'info');
    </script>
</body>
</html>
